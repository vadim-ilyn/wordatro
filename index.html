<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordatro</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="background" class="background"></div>
  <main id="app" class="app">
    <div id="top-bar" class="top-bar">
      <div id="score-area" class="score-area"></div>
      <div id="hands-area" class="hands-area"></div>
    </div>
    <div id="left-column" class="left-column">
      <div id="swap-counter-area" class="swap-counter-area"></div>
      <div id="reset-area" class="reset-area"></div>
      <div id="exchanger-area" class="exchanger-area"></div>
      <div id="swap-selection-area" class="swap-selection-area"></div>
      <div id="replace-area" class="replace-area"></div>
    </div>
    <div id="slots-area" class="slots-area"></div>
    <div id="bottom-stack" class="bottom-stack">
      <div class="controls-row">
        <div id="play-area" class="play-area"></div>
        <div id="returnall-area" class="returnall-area"></div>
      </div>
      <div id="hand-area" class="hand-area"></div>
    </div>
    <div id="deck-area" class="deck-area"></div>
    <div id="popup-layer" class="popup-layer"></div>
    <div id="boot-status" class="boot-status">Loading...</div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
